<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basic HTML Page Layout</title>
    <link rel="stylesheet" href="styles/pollform.css">
</head>
<body>

    <header>
        <h1>WDD 130 | HTML Form - User Poll</h1>
    </header>

    <main>

 <form action="#" method="post">

        <fieldset>
            <legend>Contact Information</legend>
            <div class="form-item">
                <label for="full-name">Full Name:</label>
                <input type="text" id="full-name" name="full-name">
            </div>
                <div class="form-item-column2">
                <label for="useremail">Email:</label>
                <input type="email" id="useremail" name="useremail">
            </div>
        </fieldset>

        <fieldset>
            <legend>Questions</legend>
            <div class="form-row">
                <label for="browser">What is your favorite internet browser?</label>
                <select id="browser" name="browser">
                    <option value="chrome" selected>Chrome</option>
                    <option value="firefox">Firefox</option>
                    <option value="safari">Safari</option>
                    <option value="edge">Edge</option>
                </select>
            </div>
            <div class="form-row-pet">
                <label for="pet">Do you have a household pet?</label>
                <input type="checkbox" id="pet" name="pet">
            </div>
            <div class="form-row-textarea-row">
                <label for="feedback">List the places you have lived:</label>
                <textarea id="feedback" name="feedback" rows="4" placeholder="Stillwater Florida,Amsterdam Netherlands,Timbuktu Mali"></textarea>
            </div>
        </fieldset>
        </fieldset>

        <input type="submit" value="Submit Poll">
    </form>
    <footer>
        <p>&copy; 2026 | HTML Form - User Poll | Yolanda Rodriguez.</p>
    </footer>

</body>
</html>
